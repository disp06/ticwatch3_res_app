name: Build APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Watch and phone MUST be signed with the same key or the Data Layer won't connect them.
      # Add repository secrets RC_KEYSTORE_B64 / RC_KEYSTORE_PASSWORD / RC_KEY_ALIAS / RC_KEY_PASSWORD
      # (see README) to get a stable key across builds; otherwise both APKs share this run's debug key.
      - name: Decode signing key
        env:
          RC_KEYSTORE_B64: ${{ secrets.RC_KEYSTORE_B64 }}
        if: env.RC_KEYSTORE_B64 != ''
        run: |
          echo "$RC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rc.jks"
          echo "RC_KEYSTORE_FILE=$RUNNER_TEMP/rc.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          RC_KEYSTORE_PASSWORD: ${{ secrets.RC_KEYSTORE_PASSWORD }}
          RC_KEY_ALIAS: ${{ secrets.RC_KEY_ALIAS }}
          RC_KEY_PASSWORD: ${{ secrets.RC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp wear/build/outputs/apk/release/wear-release.apk out/research-companion-watch.apk
          cp mobile/build/outputs/apk/release/mobile-release.apk out/research-companion-phone.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: research-companion-apks
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
